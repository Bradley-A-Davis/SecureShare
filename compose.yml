services:
  secureshare:
    build: .
    ports:
      - "${SECURESHARE_PORT:-23456}:23456"
    environment:
      PORT: "23456"
      INBOX_DIR: /app/inbox
      SECURESHARE_SETUP_TOKEN: "${SECURESHARE_SETUP_TOKEN:?Set a long random first-run setup credential in your environment}"
    volumes:
      - ./inbox:/app/inbox
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:23456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
